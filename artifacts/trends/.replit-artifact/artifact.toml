kind = "web"
previewPath = "/"
title = "Trends"
version = "1.0.0"
id = "artifacts/trends"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19549

[services.development]
run = "pnpm --filter @workspace/trends run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trends", "run", "build" ]
serve = "static"
publicDir = "artifacts/trends/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19549"
BASE_PATH = "/"
